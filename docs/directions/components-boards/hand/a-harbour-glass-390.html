<!doctype html>

<title>Kit A · Harbour glass at 390</title>
<!-- Kit A at 390 × 844, in a hand. The kit's own stylesheet and script, and only the reflow here:
     the pill goes to the foot with its doors as glyphs and the lit door keeping its word; the
     stage takes the width; the motor tiles stack; the toast stands above the pill. -->
<style>
:root {
  /* ---- COPIED FROM src/styles/tokens.css, byte for byte, with THE NIGHT applied -------------
     (`:root[data-theme='night']`), because this board is drawn on the dark ground. Nothing in
     this block is new; the kit's own additions follow it, each with its reason. */
  --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
  --color-white: #ffffff;
  --color-neutral-50: oklch(95.9% 0.0059 239.8);
  --color-neutral-100: oklch(92.8% 0.0187 243);
  --color-neutral-200: oklch(87.4% 0.0295 244.9);
  --color-neutral-300: oklch(76.3% 0.0323 234.6);
  --color-neutral-400: oklch(72% 0.0362 233.3);
  --color-neutral-500: oklch(51.6% 0.0335 237.5);
  --color-neutral-600: oklch(44.8% 0.041 238.7);
  --color-neutral-700: oklch(38% 0.049 239.9);
  --color-neutral-800: oklch(31% 0.0487 241.9);
  --color-neutral-900: oklch(23.5% 0.0484 243.9);
  --color-neutral-950: oklch(18.9% 0.0309 231.6);
  --color-blue-50: oklch(95.4% 0.0194 252.9);
  --color-blue-100: oklch(90% 0.05 249);
  --color-blue-200: oklch(84.4% 0.0826 245.6);
  --color-blue-300: oklch(78.1% 0.104 233.7);
  --color-blue-400: oklch(69.5% 0.1205 240.7);
  --color-blue-500: oklch(60.3% 0.1379 248.2);
  --color-blue-600: oklch(51.2% 0.1554 255.7);
  --color-blue-700: oklch(43.5% 0.145 257);
  --color-blue-800: oklch(36% 0.12 258);
  --color-blue-900: oklch(29.5% 0.095 259);
  --color-blue-950: oklch(23% 0.07 260);
  --color-amber-400: oklch(78.3% 0.1453 73);
  --color-amber-500: oklch(69.9% 0.1285 72.9);
  --color-amber-600: oklch(61.5% 0.1117 72.8);
  --color-paper: oklch(98.5% 0.0041 91.4);
  --color-accent: var(--color-blue-600);
  --color-act: var(--color-amber-400);
  --color-ground: var(--color-neutral-950);
  --color-panel: var(--color-neutral-900);
  --color-ink: var(--color-white);
  --color-ink-2: var(--color-neutral-300);
  --color-ink-3: var(--color-neutral-400);
  --color-ink-file: var(--color-blue-300);
  --color-act-refused: var(--color-amber-600);
  --color-act-ink: var(--color-amber-400);
  --color-ink-on-accent: var(--color-white);
  --color-ink-on-act: var(--color-neutral-900);
  --color-ink-on-act-refused: var(--color-neutral-950);
  --color-ink-reason: var(--color-ink-2);
  --color-ink-reason-paper: var(--color-neutral-600);
  --color-ink-reason-picture: var(--color-neutral-100);
  --color-veil-82: oklch(13.9% 0.0244 241.3 / 82%);
  --color-veil-72: oklch(13.9% 0.0244 241.3 / 72%);
  --color-veil-60: oklch(13.9% 0.0244 241.3 / 60%);
  --color-veil-30: oklch(13.9% 0.0244 241.3 / 30%);
  --color-veil-20: oklch(13.9% 0.0244 241.3 / 20%);
  --color-veil-05: oklch(13.9% 0.0244 241.3 / 5%);
  --color-veil-00: oklch(13.9% 0.0244 241.3 / 0%);
  --color-glass: oklch(18.9% 0.0309 231.6 / 80%);
  --color-door: oklch(18.9% 0.0309 231.6 / 86%);
  --color-wash: rgb(255 255 255 / 10%);
  --color-rule: rgb(255 255 255 / 16%);
  --color-rule-strong: rgb(255 255 255 / 26%);
  --color-edge: rgb(255 255 255 / 55%);
  --color-control-edge: oklch(60% 0.036 237);
  --color-halo: oklch(18.9% 0.0309 231.6 / 85%);
  --color-select: oklch(51.2% 0.1554 255.7 / 28%);
  --accent-blue: var(--color-blue-300);
  --accent-carmine: oklch(74% 0.13 22);
  --accent-viridian: oklch(75% 0.115 163);
  --accent-ochre: oklch(76% 0.1 92);
  --accent-violet: oklch(77% 0.1 300);
  --accent-teal: oklch(77% 0.095 197);
  --accent-graphite: var(--color-neutral-400);
  --swatch-white: oklch(98.5% 0 0);
  --swatch-blue: oklch(51% 0.15 258);
  --swatch-light-grey: oklch(85% 0.004 250);
  --swatch-edge: oklch(45% 0.02 245 / 45%);
  --text-2xs: 0.6875rem;
  --text-xs: 0.75rem;
  --text-sm: 0.8125rem;
  --text-base: 0.875rem;
  --text-lg: 1rem;
  --text-xl: 1.125rem;
  --text-2xl: 1.375rem;
  --text-3xl: 1.625rem;
  --text-4xl: 1.875rem;
  --text-5xl: 2.125rem;
  --text-6xl: 2.5rem;
  --tracking-caps: 0.14em;
  --tracking-wordmark: 0.2em;
  --tracking-mark: 0.28em;
  --tracking-display: -0.016em;
  --radius-xs: 4px;
  --radius-sm: 10px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --radius-pill: 999px;
  --mark: 2px;
  --blur-glass: 20px;
  --shadow-sm: 0 6px 16px rgb(0 0 0 / 22%), 0 1px 2px rgb(0 0 0 / 18%);
  --shadow-md: 0 18px 40px rgb(0 0 0 / 45%);
  --shadow-lg: 0 40px 90px rgb(0 0 0 / 55%), inset 0 1px 0 rgb(255 255 255 / 10%);
  --shadow-focus: 0 0 0 2px var(--color-white), 0 0 0 4px var(--color-blue-200), 0 0 0 7px var(--color-halo);
  --ease-out: cubic-bezier(0.2, 0, 0, 1);
  --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-drawer: cubic-bezier(0.05, 0.7, 0.1, 1);
  --duration-press: 100ms;
  --duration-pop: 150ms;
  --duration-open: 200ms;
  --duration-sheet: 300ms;
  --duration-reveal: 400ms;


  /* ---- ADDED BY KIT A · HARBOUR GLASS -------------------------------------------------------
     Materials, lights and springs. Every light is DERIVED from --color-accent or --color-act
     with relative colour syntax, so when Northside sets its own accent in its settings every
     rim, glow and keycap here re-lights from it and nothing else moves. */

  /* GLASS BY JOB (HIG, systems/hig-materials-scrolled.png): regular under words, clear over a
     photograph, thick for a sheet. The base is the night panel and the veil, at alphas chosen
     so white type on them keeps 4.5:1 over the brightest thing measured beneath (the board's
     contrast pass reads the real pixels). */
  --glass-regular: oklch(23.5% 0.0484 243.9 / 62%);
  --glass-thick: oklch(21% 0.045 243.9 / 80%);
  --glass-clear: oklch(13.9% 0.0244 241.3 / 54%);
  /* CLEAR GLASS OVER A PHOTOGRAPH needs a dimming layer under its words (HIG): the veil at 70% */
  --glass-picture: oklch(13.9% 0.0244 241.3 / 70%);
  --glass-well: oklch(13.9% 0.0244 241.3 / 55%);
  --blur-regular: 24px;
  --blur-thick: 40px;
  --blur-clear: 14px;
  /* light catching a rim: the one-pixel top highlight Raycast's keycap has (live/raycast-pro.png) */
  --edge-light: rgb(255 255 255 / 14%);
  --edge-light-strong: rgb(255 255 255 / 36%);
  --edge-under: rgb(0 0 0 / 38%);
  --rim: rgb(255 255 255 / 11%);
  --rim-strong: rgb(255 255 255 / 22%);
  /* THE LIT RIM — Stripe's ring (live/stripe-checkout-demo.png) as light rather than a line */
  --rim-lit: oklch(from var(--color-accent) calc(l + 0.22) calc(c * 0.8) h);
  --glow-lit: oklch(from var(--color-accent) calc(l + 0.18) c h / 42%);
  --wash-lit: oklch(from var(--color-accent) calc(l + 0.1) c h / 16%);
  /* THE KEYCAP — a fill that is lighter at the top, a bright top edge, a dark underside and a
     contact shadow in the key's own hue. White on the lighter stop measures 5.2 : 1. */
  --key-accent: linear-gradient(180deg, oklch(from var(--color-accent) calc(l + 0.03) c h), oklch(from var(--color-accent) calc(l - 0.06) c h));
  --key-accent-hover: linear-gradient(180deg, oklch(from var(--color-accent) calc(l + 0.05) c h), oklch(from var(--color-accent) calc(l - 0.03) c h));
  --key-act: linear-gradient(180deg, var(--color-amber-400), var(--color-amber-500));
  --key-act-hover: linear-gradient(180deg, oklch(from var(--color-amber-400) calc(l + 0.03) c h), var(--color-amber-400));
  --key-glass: linear-gradient(180deg, rgb(255 255 255 / 12%), rgb(255 255 255 / 5%));
  --key-glass-hover: linear-gradient(180deg, rgb(255 255 255 / 18%), rgb(255 255 255 / 8%));
  --shadow-key: inset 0 1px 0 var(--edge-light-strong), inset 0 -1px 0 var(--edge-under), 0 1px 1px rgb(0 0 0 / 45%), 0 10px 22px -10px oklch(from var(--color-accent) calc(l - 0.1) c h / 90%);
  --shadow-key-act: inset 0 1px 0 rgb(255 255 255 / 45%), inset 0 -1px 0 var(--edge-under), 0 1px 1px rgb(0 0 0 / 45%), 0 10px 22px -10px oklch(from var(--color-act) calc(l - 0.25) c h / 90%);
  --shadow-key-glass: inset 0 1px 0 var(--edge-light), inset 0 -1px 0 var(--edge-under), 0 1px 1px rgb(0 0 0 / 40%), 0 8px 18px -10px rgb(0 0 0 / 70%);
  --shadow-key-pressed: inset 0 1px 3px rgb(0 0 0 / 40%), inset 0 0 0 1px rgb(0 0 0 / 12%);
  --shadow-lit: 0 0 0 1px var(--rim-lit), 0 0 0 4px var(--wash-lit), 0 12px 32px -12px var(--glow-lit);
  --shadow-float: 0 24px 60px -18px rgb(0 0 0 / 70%), 0 2px 6px rgb(0 0 0 / 35%), inset 0 1px 0 var(--edge-light);
  /* the small shadows every control here casts, named so no drawing writes a colour */
  --shadow-door-lit: inset 0 -1px 0 rgb(0 0 0 / 12%), 0 4px 14px -6px var(--glow-lit);
  --shadow-well: inset 0 1px 2px rgb(0 0 0 / 40%);
  --shadow-well-deep: inset 0 1px 3px rgb(0 0 0 / 45%);
  --shadow-thumb: 0 2px 8px rgb(0 0 0 / 35%), inset 0 -1px 0 rgb(0 0 0 / 10%);
  --shadow-knob: 0 2px 6px rgb(0 0 0 / 40%);
  --edge-light-refused: rgb(255 255 255 / 22%);
  /* a white word lit from behind, for the mark only */
  --glow-mark: 0 0 28px oklch(from var(--color-accent) calc(l + 0.3) c h / 55%);
  /* THE WATER — the shader's two colours: the room's own navy, and the accent taken up to where
     light on water reads. CAPPED in the shader at 0.43 per sRGB channel, so the brightest pixel
     it can paint holds white type at 5.1 : 1. */
  --water-deep: var(--color-neutral-950);
  --water-lit: oklch(from var(--color-accent) 0.62 calc(c * 0.7) calc(h - 12));
  /* SPRINGS, sampled into CSS linear() from Apple's two parameters (damping, response):
     settle = 1.0 / 0.35 s, the default for anything that moves (the lit door, a thumb);
     sheet  = 0.85 / 0.30 s, a sheet arriving; the only one with overshoot (0.6%). */
  --spring-settle: linear(0, 0.023, 0.079, 0.154, 0.237, 0.321, 0.404, 0.481, 0.552, 0.615, 0.672, 0.721, 0.764, 0.802, 0.833, 0.861, 0.884, 0.903, 0.919, 0.933, 0.945, 0.954, 0.962, 0.969, 0.974, 0.979, 0.983, 0.986, 0.988, 0.991, 0.992, 0.994, 0.995, 0.996, 0.997, 0.997, 0.998, 0.998, 0.999, 0.999, 1);
  --spring-settle-ms: 515ms;
  --spring-sheet: linear(0, 0.021, 0.075, 0.149, 0.234, 0.323, 0.412, 0.496, 0.575, 0.646, 0.709, 0.764, 0.811, 0.851, 0.885, 0.913, 0.935, 0.954, 0.968, 0.979, 0.988, 0.994, 0.999, 1.002, 1.004, 1.005, 1.006, 1.006, 1.006, 1.006, 1.005, 1.005, 1.004, 1.004, 1.003, 1.003, 1.002, 1.002, 1.002, 1.001, 1);
  --spring-sheet-ms: 419ms;
}

* { box-sizing: border-box; }
html, body { margin: 0; width: 1440px; height: 900px; overflow: hidden; }
body {
  background: var(--color-ground);
  color: var(--color-ink);
  font: 400 var(--text-base)/1.45 var(--font-sans);
  position: relative;
  -webkit-font-smoothing: antialiased;
}
#water { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.board { position: absolute; inset: 0; padding: 64px 24px 20px; display: grid;
  grid-template-columns: 404px 424px 1fr; column-gap: 20px; }
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

/* ---- small print ---- */
.cap { font: 400 var(--text-2xs)/1.35 var(--font-mono); color: var(--color-ink-3); letter-spacing: 0.02em; }
.eyebrow { font: 600 var(--text-2xs)/1.35 var(--font-sans); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--color-ink-file); }
.title { position: absolute; left: 24px; top: 16px; display: flex; align-items: baseline; gap: 10px; }
.title b { font: 600 var(--text-lg)/1 var(--font-sans); letter-spacing: -0.005em; }
.title span { color: var(--color-ink); font-size: var(--text-sm); }
.meta { position: absolute; right: 24px; top: 18px; }
.i { width: 18px; height: 18px; fill: currentColor; flex: none; }
.i.sm { width: 16px; height: 16px; }
.i.lg { width: 20px; height: 20px; }

/* ---- a plate of regular glass ---- */
.glass { background: var(--glass-regular); backdrop-filter: blur(var(--blur-regular)) saturate(160%);
  border-radius: var(--radius-lg); box-shadow: inset 0 1px 0 var(--edge-light), 0 0 0 1px var(--rim), var(--shadow-sm); padding: 14px 16px; }
.glass > .eyebrow { display: block; margin-bottom: 10px; }

/* ================= THE FLOATING PILL ================= */
.pill { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 3;
  display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: var(--radius-pill);
  background: var(--glass-regular); backdrop-filter: blur(var(--blur-regular)) saturate(160%);
  box-shadow: var(--shadow-float), 0 0 0 1px var(--rim); }
.crest { width: 40px; height: 40px; border-radius: var(--radius-pill); display: grid; place-items: center;
  background: var(--key-glass); box-shadow: var(--shadow-key-glass);
  font: 600 var(--text-xs)/1 var(--font-sans); letter-spacing: var(--tracking-wordmark); padding-left: 2px; color: var(--color-ink); text-decoration: none; }
.doors { display: flex; position: relative; margin: 0 4px; padding: 0; list-style: none; }
.door { position: relative; display: flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px;
  border-radius: var(--radius-pill); color: var(--color-ink-2); text-decoration: none; font-weight: 500;
  transition: color var(--duration-pop) var(--ease-out), background-color var(--duration-pop) var(--ease-out); }
.door .n { font: 500 var(--text-2xs)/1 var(--font-mono); color: var(--color-ink-3); }
.door[aria-current] { color: var(--color-neutral-950); background: var(--color-white);
  box-shadow: var(--shadow-door-lit); }
.door[aria-current] .n { color: var(--color-neutral-700); }
.find { width: 40px; height: 40px; border-radius: var(--radius-pill); display: grid; place-items: center; color: var(--color-ink);
  background: var(--key-glass); box-shadow: var(--shadow-key-glass); }
@media (hover: hover) and (pointer: fine) {
  .door:not([aria-current]):hover { color: var(--color-ink); background: var(--color-wash); }
  .crest:hover, .find:hover { background: var(--key-glass-hover); }
}
.door:active, .crest:active, .find:active { transform: scale(0.97); }

/* ================= THE MARK PLATE (the showpiece) ================= */
.mark { position: relative; height: 168px; flex: none; border-radius: var(--radius-lg); overflow: hidden;
  background: var(--glass-clear); box-shadow: inset 0 1px 0 var(--edge-light-strong), 0 0 0 1px var(--rim-strong), var(--shadow-md);
  display: grid; align-content: center; justify-items: center; text-align: center; }
.mark .cone { position: absolute; inset: 0; background: radial-gradient(60% 90% at 50% -10%, var(--glow-lit), transparent 70%); pointer-events: none; }
.mark .word { position: relative; font: 300 var(--text-6xl)/1 var(--font-sans); letter-spacing: var(--tracking-wordmark);
  text-indent: var(--tracking-wordmark); text-shadow: var(--glow-mark); animation: arrive 1.2s var(--ease-out) both; }
.mark .sub { position: relative; margin-top: 10px; font: 500 var(--text-xs)/1 var(--font-sans); letter-spacing: var(--tracking-mark);
  text-indent: var(--tracking-mark); text-transform: uppercase; color: var(--color-ink-2); animation: arrive 1.2s 120ms var(--ease-out) both; }
.mark .say { position: absolute; left: 14px; right: 14px; bottom: 10px; display: flex; justify-content: center; }
.mark .gltag { position: absolute; top: 10px; right: 12px; }
@keyframes arrive { from { opacity: 0; filter: blur(8px); transform: translateY(6px); } }

/* ================= ACTS: keycaps ================= */
.acts { display: grid; gap: 10px; padding-bottom: 12px; }
.btn { --h: 40px; position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: var(--h);
  padding: 0 16px; border: 0; border-radius: var(--radius-md); font: 600 var(--text-base)/1 var(--font-sans);
  letter-spacing: 0.005em; cursor: pointer; white-space: nowrap; color: var(--color-ink);
  transition: transform var(--duration-press) var(--ease-out), box-shadow var(--duration-press) var(--ease-out), background-color var(--duration-pop) var(--ease-out); }
.btn .i { transition: transform var(--duration-open) var(--ease-out); }
.btn.primary { background: var(--key-accent); color: var(--color-ink-on-accent); box-shadow: var(--shadow-key); }
.btn.act { background: var(--key-act); color: var(--color-ink-on-act); box-shadow: var(--shadow-key-act); }
.btn.secondary { background: var(--key-glass); box-shadow: var(--shadow-key-glass); backdrop-filter: blur(var(--blur-clear)); }
.btn.quiet { background: transparent; color: var(--color-ink-2); box-shadow: none; padding: 0 10px; }
@media (hover: hover) and (pointer: fine) {
  .btn.primary:hover, .btn.primary.is-hover { background: var(--key-accent-hover); }
  .btn.act:hover { background: var(--key-act-hover); }
  .btn.secondary:hover { background: var(--key-glass-hover); }
  .btn.quiet:hover { color: var(--color-ink); background: var(--color-wash); }
  .btn:hover .i.go { transform: translateX(3px); }
}
.btn.primary.is-hover { background: var(--key-accent-hover); }
.btn.is-hover .i.go { transform: translateX(3px); }
.btn:active, .btn.is-press { transform: translateY(1px) scale(0.98); box-shadow: var(--shadow-key-pressed); }
.btn:focus-visible, .btn.is-focus { outline: none; box-shadow: var(--shadow-key), var(--shadow-focus); }
.btn[aria-disabled='true'] { background: var(--key-glass); color: var(--color-ink-2); box-shadow: inset 0 0 0 1px var(--rim-strong); cursor: default; transform: none; }
.btn.act[aria-disabled='true'] { background: var(--color-act-refused); color: var(--color-ink-on-act-refused); box-shadow: inset 0 1px 0 var(--edge-light-refused); }
.btn.sm { --h: 34px; padding: 0 12px; font-size: var(--text-sm); }
.states { display: grid; grid-template-columns: repeat(4, auto); gap: 6px 10px; margin-top: 4px; justify-content: start; align-items: end; }
.states figure { margin: 0; display: grid; gap: 10px; justify-items: start; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.refusal { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0 0; color: var(--color-ink-reason); font-size: var(--text-sm); line-height: 1.45; }
.refusal .i { margin-top: 1px; color: var(--color-act-ink); }

/* ================= CHOICES ================= */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: var(--radius-pill);
  background: var(--glass-well); box-shadow: inset 0 1px 0 var(--edge-light), 0 0 0 1px var(--rim-strong); color: var(--color-ink-2); font-weight: 500; font-size: var(--text-sm); border: 0; cursor: pointer;
  transition: transform var(--duration-press) var(--ease-out), color var(--duration-pop) var(--ease-out); }
.chip .n { font: 500 var(--text-2xs)/1 var(--font-mono); color: var(--color-ink-2); }
.chip[aria-pressed='true'] { color: var(--color-ink); box-shadow: var(--shadow-lit); background: var(--wash-lit); }
.chip[aria-pressed='true'] .n { color: var(--color-ink); }
@media (hover: hover) and (pointer: fine) { .chip:hover { color: var(--color-ink); } }
.chip:active { transform: scale(0.97); }

.seg { position: relative; display: inline-grid; grid-template-columns: 1fr 1fr; padding: 3px; border-radius: var(--radius-pill);
  background: var(--glass-well); box-shadow: var(--shadow-well), 0 0 0 1px var(--rim); }
.seg .thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: var(--radius-pill);
  background: var(--color-white); box-shadow: var(--shadow-thumb);
  transition: transform var(--spring-settle-ms) var(--spring-settle); }
.seg[data-at='trade'] .thumb { transform: translateX(100%); }
.seg button { position: relative; z-index: 1; height: 32px; padding: 0 16px; border: 0; background: none; cursor: pointer;
  display: inline-flex; gap: 6px; align-items: center; justify-content: center; font: 600 var(--text-sm)/1 var(--font-sans); color: var(--color-ink-2);
  transition: color var(--duration-open) var(--ease-out); }
.seg button[aria-checked='true'] { color: var(--color-neutral-950); }

.toggle { display: flex; align-items: center; gap: 10px; font-size: var(--text-sm); color: var(--color-ink-2); }
.switch { position: relative; width: 46px; height: 28px; border-radius: var(--radius-pill); border: 0; padding: 0; cursor: pointer; flex: none;

<script>
/* THE WATER. ~2 KB of GLSL written for this board, tinted from the tokens, capped so the
   brightest pixel holds white type at 5.1 : 1, one still frame under reduced motion, and
   stopped while a caret is in a field (the rule: nothing moves while a caret is in a text
   field). No library. */
(() => {
  const cv = document.getElementById('water')
  const gl = cv.getContext('webgl', { antialias: false, premultipliedAlpha: false })
  const tag = document.getElementById('gl') ?? {}
  if (!gl) { tag.textContent = 'no WebGL · the gradient stands'; return }
  /* HALF RESOLUTION: the water is soft light, so a quarter of the pixels is drawn and the
     canvas is scaled up by CSS — measured 4× cheaper a frame */
  const S = 0.5, W = Math.round(innerWidth * S), H = Math.round(innerHeight * S)
  cv.width = W; cv.height = H; gl.viewport(0, 0, W, H)
  const rgb = (name) => {
    const probe = document.createElement('canvas').getContext('2d')
    probe.fillStyle = getComputedStyle(document.documentElement).getPropertyValue(name).trim()
    probe.fillRect(0, 0, 1, 1)
    const d = probe.getImageData(0, 0, 1, 1).data
    return [d[0] / 255, d[1] / 255, d[2] / 255]
  }
  const vs = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'
  const fs = `precision mediump float;
uniform vec2 R;uniform float T;uniform vec3 D;uniform vec3 L;uniform vec2 C;uniform float CAP;
float w(vec2 p,float a,float k,float s){return sin(dot(p,vec2(cos(a),sin(a)))*k+T*s);}
void main(){
  vec2 f=gl_FragCoord.xy; vec2 p=f/110.;
  p+=.35*vec2(sin(p.y*1.7+T*.23),cos(p.x*1.3-T*.19));
  float h=w(p,.3,3.1,.9)+w(p,1.9,2.7,-.7)+w(p,3.4,3.6,.6)+w(p,4.8,2.3,-.8);
  float c=pow(1.-abs(h)/4.,5.);
  vec2 q=(f-C)/R.y; float cone=exp(-dot(q*vec2(1.,1.6),q*vec2(1.,1.6))*2.2);
  float room=.28+.72*cone;
  vec3 col=mix(D,L,clamp(c*room*1.5+cone*.3,0.,1.));
  gl_FragColor=vec4(min(col,vec3(CAP)),1.);
}`
  const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o }
  const pr = gl.createProgram()
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr); gl.useProgram(pr)
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer())
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW)
  const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0)
  const u = (n) => gl.getUniformLocation(pr, n)
  const plate = document.getElementById('markplate').getBoundingClientRect()
  gl.uniform2f(u('R'), W, H)
  gl.uniform3fv(u('D'), rgb('--water-deep')); gl.uniform3fv(u('L'), rgb('--water-lit'))
  gl.uniform2f(u('C'), (plate.left + plate.width / 2) * S, H - (plate.top + plate.height * 0.35) * S)
  gl.uniform1f(u('CAP'), 0.43)
  const still = matchMedia('(prefers-reduced-motion: reduce)')
  let caret = false, t0 = performance.now()
  addEventListener('focusin', (e) => { caret = e.target.matches('input, textarea, [contenteditable]') })
  addEventListener('focusout', () => { caret = false })
  const frame = (now) => {
    gl.uniform1f(u('T'), 8 + (now - t0) / 1000)
    gl.drawArrays(gl.TRIANGLES, 0, 3)
    if (!still.matches && !document.hidden && !caret) requestAnimationFrame(frame)
    else setTimeout(() => requestAnimationFrame(frame), 250)
  }
  requestAnimationFrame(frame)
  tag.textContent = 'WebGL, live'
})()

/* THE PRICE IS REPLACED, NEVER ROLLED. Cash and Trade are two cells of the file:
   boat_highfield.qr 41,340 and .qt 39,273 on HBS113. */
for (const seg of document.querySelectorAll('.seg')) {
  seg.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return
    seg.dataset.at = b.dataset.to
    for (const x of seg.querySelectorAll('button')) x.setAttribute('aria-checked', String(x === b))
    if (seg.id === 'seg2') {
      document.getElementById('fig').innerHTML = b.dataset.to === 'cash' ? '<small>$</small>41,340' : '<small>$</small>39,273'
      document.getElementById('figsay').textContent = b.dataset.to === 'cash' ? 'Cash · the hull, as the file prices it' : 'Trade · the hull, as the file prices it'
    }
  })
}
for (const s of document.querySelectorAll('.switch')) s.addEventListener('click', () => s.setAttribute('aria-checked', String(s.getAttribute('aria-checked') !== 'true')))
for (const c of document.querySelectorAll('.chip')) c.addEventListener('click', () => { for (const o of c.parentNode.children) o.setAttribute('aria-pressed', String(o === c)) })
for (const t of document.querySelectorAll('.tile')) t.addEventListener('click', () => t.setAttribute('aria-pressed', String(t.getAttribute('aria-pressed') !== 'true')))
</script>
