<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      THE APP IS THE DAY AND THE DOCUMENT SAYS SO, before a byte of CSS has loaded (2026-09-24:
      blue and white was the brief; the dark room of 2026-09-18 is the night, offered and not
      default). `:root { color-scheme: light }` in src/styles/app.css is the same statement to
      the cascade and src/app/theme.ts moves both to dark for a person who chose the night;
      this one is here so the FIRST paint of a cold load is the day's canvas and not a
      scheme the screens disagree with.
    -->
    <meta name="color-scheme" content="light" />
    <title>HelmLogic</title>
    <!--
      THE TAB WEARS THE CREST, and the shell draws it (src/screens/shell/tab.ts) in the tokens'
      own inks once the page has them. Until then the icon is declared EMPTY, so the browser does
      not go asking for a /favicon.ico this app does not have — it answered 404 twice on every
      load (build-close-critique, minor 19).
    -->
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
